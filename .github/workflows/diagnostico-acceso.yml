name: Diagnóstico de acceso en producción
on:
  push:
    branches: [diagnostic/acceso-produccion]
permissions: {}
jobs:
  probe:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - shell: bash
        run: |
          node --input-type=module <<'JS'
          import { randomUUID } from 'node:crypto';
          const base = 'https://vidres-sosa-ia.pausosagomez.workers.dev';
          const Origin = 'https://paanser.github.io';
          for (const [method,path,extra,body] of [
            ['OPTIONS','/auth/login',{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}],
            ['OPTIONS','/auth/me',{'Access-Control-Request-Method':'GET','Access-Control-Request-Headers':'authorization'}],
            ['POST','/auth/login',{'Content-Type':'application/json'},JSON.stringify({usuario:'diag-'+randomUUID(),password:randomUUID()})],
          ]) {
            const start = performance.now();
            try {
              const response = await fetch(base+path,{method,headers:{Origin,...extra},body,signal:AbortSignal.timeout(20000)});
              const size = (await response.text()).length;
              console.log({method,path,status:response.status,ms:Math.round(performance.now()-start),cors:response.headers.get('access-control-allow-origin'),ray:response.headers.get('cf-ray')?.split('-').at(-1),size});
              if (response.headers.get('access-control-allow-origin') !== Origin || response.status !== (method==='POST'?401:204)) process.exitCode=1;
            } catch (error) { console.log(method,path,error.message); process.exitCode=1; }
          }
          JS
  webkit:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: |
          node <<'JS'
          const { webkit, devices } = require('playwright');
          const { randomUUID } = require('node:crypto');
          (async () => {
            const browser = await webkit.launch();
            try {
              const page = await browser.newPage(devices['iPhone 13']);
              page.on('requestfailed', request => {
                if (request.url().includes('workers.dev')) console.log('::notice::' + request.failure()?.errorText);
              });
              await page.goto('https://paanser.github.io/vidres-sosa-gestion/?v=1be467a11b1b5c7124c2964980b8adafdf1a0164');
              await page.locator('#login-form [name=usuario]').fill('diag-' + randomUUID());
              await page.locator('#login-form [name=password]').fill(randomUUID());
              const start = Date.now();
              const [result] = await Promise.all([
                page.waitForResponse(response => response.url().endsWith('/auth/login') && response.request().method() === 'POST'),
                page.getByRole('button', {name:'Entrar'}).click(),
              ]);
              if (result.status() !== 401) throw Error('HTTP ' + result.status());
              await page.getByText('Usuario o contraseña incorrectos').waitFor();
              console.log('::notice::Formulario publicado en WebKit iPhone: respuesta 401 esperada en ' + (Date.now() - start) + ' ms');
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
