name: Publicar Vidres Sosa Gestión
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx prettier --check .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Asignar versión a los recursos
        run: |
          python3 -c 'import json, os; p="index.html"; v=json.load(open("version.json"))["version"]; s=open(p).read(); open(p,"w").write(s.replace("?v="+v, "?v="+os.environ["GITHUB_SHA"]))'
          python3 -c 'import json, os; open("version.json", "w").write(json.dumps({"version": os.environ["GITHUB_SHA"]}))'
          python3 -c 'import os; p="sw.js"; s=open(p).read(); open(p,"w").write(s.replace("__BUILD_VERSION__", os.environ["GITHUB_SHA"]))'
      - name: Preparar archivos públicos
        run: |
          mkdir public
          cp index.html styles.css manifest.json version.json loader.js auth.js users.js migration.js utils.js storage.js calculations.js files.js backup.js tariffs.js tools.js brand-logo.js quote-pdf.js milestones.js facturadirecta.js quotes.js sketch.js job-measures.js app.js ai-config.js voice.js enhancements.js job-sheet-pdf.js expediente.js operations-model.js operations.js pwa.js sw.js public/
          cp -R vendor public/vendor
          cp -R icons public/icons
          cp -R documents public/documents
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Comprobar versión publicada y API privada
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { randomBytes } from "node:crypto";
          const base = "https://paanser.github.io/vidres-sosa-gestion/";
          const revision = process.env.GITHUB_SHA;
          const branchVersion = JSON.parse(execFileSync("git", ["show", "HEAD:version.json"], {encoding: "utf8"})).version;
          const entryAssets = ["auth.js", "pwa.js", "facturadirecta.js"];
          let published = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(base + "version.json?v=" + revision, { cache: "no-store", signal: AbortSignal.timeout(15000) });
            const version = response.ok && (await response.json()).version;
            if ([revision, branchVersion].includes(version)) {
              const entry = await fetch(base + "?v=" + revision, { cache: "no-store", signal: AbortSignal.timeout(15000) });
              const html = entry.ok ? await entry.text() : "";
              const matches = await Promise.all(entryAssets.map(async (asset) => {
                const response = await fetch(base + asset + "?v=" + revision, { cache: "no-store", signal: AbortSignal.timeout(15000) });
                return response.ok && readFileSync("public/" + asset).equals(Buffer.from(await response.arrayBuffer()));
              }));
              if (matches.every(Boolean) && ["auth.js", "pwa.js"].every((asset) => html.includes('src="' + asset + '?v=' + version + '"'))) { published = true; break; }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!published) throw Error("La versión pública todavía no coincide con el despliegue");
          const origin = "https://paanser.github.io";
          const auth = "https://vidres-sosa-ia.pausosagomez.workers.dev/auth/me";
          const preflight = await fetch(auth, { method: "OPTIONS", headers: { Origin: origin, "Access-Control-Request-Method": "GET", "Access-Control-Request-Headers": "authorization" }, signal: AbortSignal.timeout(15000) });
          if (preflight.status !== 204 || preflight.headers.get("access-control-allow-origin") !== origin || !/\bauthorization\b/i.test(preflight.headers.get("access-control-allow-headers"))) throw Error("La comprobación CORS de sesión ha fallado");
          const unknownSession = await fetch(auth, { headers: { Origin: origin, Authorization: "Bearer " + randomBytes(32).toString("hex") }, signal: AbortSignal.timeout(15000) });
          if (unknownSession.status !== 401 || unknownSession.headers.get("access-control-allow-origin") !== origin) throw Error("La comprobación de sesión con la base de datos ha fallado (" + unknownSession.status + ")");
          for (const asset of ["operations.js", "operations-model.js", "milestones.js", "job-sheet-pdf.js"]) {
            const response = await fetch(base + asset + "?v=" + revision, { signal: AbortSignal.timeout(15000) });
            if (!response.ok || !(response.headers.get("content-type") || "").includes("javascript")) throw Error("Recurso público ausente: " + asset);
          }
          for (const path of ["/api/state", "/api/files", "/api/users"]) {
            const response = await fetch("https://vidres-sosa-ia.pausosagomez.workers.dev" + path, { headers: { Origin: "https://paanser.github.io" }, signal: AbortSignal.timeout(15000) });
            if (response.status !== 401) throw Error("La API privada no devuelve 401 sin sesión: " + path + " (" + response.status + ")");
          }
          console.log("Versión pública, nuevos módulos y protección 401 verificados: " + revision);
          JS
