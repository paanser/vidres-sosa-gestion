name: Publicar Vidres Sosa Gestión
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx prettier --check .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Asignar versión a los recursos
        run: |
          python3 -c 'import json, os; open("version.json", "w").write(json.dumps({"version": os.environ["GITHUB_SHA"]}))'
          python3 -c 'import os; p="sw.js"; s=open(p).read(); open(p,"w").write(s.replace("__BUILD_VERSION__", os.environ["GITHUB_SHA"]))'
      - name: Preparar archivos públicos
        run: |
          mkdir public
          cp index.html styles.css manifest.json version.json loader.js auth.js users.js migration.js utils.js storage.js calculations.js files.js backup.js tariffs.js tools.js quote-pdf.js milestones.js quotes.js sketch.js job-measures.js app.js ai-config.js voice.js enhancements.js job-sheet-pdf.js expediente.js operations-model.js operations.js pwa.js sw.js public/
          cp -R vendor public/vendor
          cp -R icons public/icons
          cp -R documents public/documents
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar versión publicada y API privada
        run: |
          node --input-type=module <<'JS'
          const base = "https://paanser.github.io/vidres-sosa-gestion/";
          const revision = process.env.GITHUB_SHA;
          let published = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(base + "version.json?v=" + revision, { cache: "no-store", signal: AbortSignal.timeout(15000) });
            if (response.ok && (await response.json()).version === revision) { published = true; break; }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!published) throw Error("La versión pública todavía no coincide con el despliegue");
          for (const asset of ["operations.js", "operations-model.js", "milestones.js", "job-sheet-pdf.js"]) {
            const response = await fetch(base + asset + "?v=" + revision, { signal: AbortSignal.timeout(15000) });
            if (!response.ok || !(response.headers.get("content-type") || "").includes("javascript")) throw Error("Recurso público ausente: " + asset);
          }
          for (const path of ["/api/state", "/api/files", "/api/users"]) {
            const response = await fetch("https://vidres-sosa-ia.pausosagomez.workers.dev" + path, { headers: { Origin: "https://paanser.github.io" }, signal: AbortSignal.timeout(15000) });
            if (response.status !== 401) throw Error("La API privada no devuelve 401 sin sesión: " + path + " (" + response.status + ")");
          }
          console.log("Versión pública, nuevos módulos y protección 401 verificados: " + revision);
          JS
